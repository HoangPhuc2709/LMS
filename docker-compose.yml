

services:
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - lms_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - lms_network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=lms1
      - DB_USERNAME=root
      - DB_PASSWORD=root

  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=lms1
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lms_phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  mysql_data:


